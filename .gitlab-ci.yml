# Replaces .github/workflows/{test,docker-publish}.yml; GitHub is a push
# mirror only. The runner is unprivileged with no docker.sock, hence kaniko.

# An open MR's pipeline is the gating one; a branch pipeline beside it would
# only duplicate it.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

stages: [test, publish]

test:
  stage: test
  image: golang:1.25
  interruptible: true
  variables:
    # Inside the build dir so the cache can see it; ./... skips dot-dirs.
    GOPATH: $CI_PROJECT_DIR/.go
  cache:
    key:
      files: [go.sum]
    paths: [.go/pkg/mod]
  script:
    - go vet ./...
    - go test ./... -count=1

publish:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        IMAGE_TAGS: latest $CI_DEFAULT_BRANCH sha-$CI_COMMIT_SHORT_SHA
    - if: $CI_COMMIT_TAG =~ /^v/
      variables:
        IMAGE_TAGS: $CI_COMMIT_TAG
  script:
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
    - set --; for t in $IMAGE_TAGS; do set -- "$@" --destination "$CI_REGISTRY_IMAGE:$t"; done
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile "$@"
